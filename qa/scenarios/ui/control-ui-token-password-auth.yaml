title: Control UI Gateway secret submission

scenario:
  id: control-ui-token-password-auth
  surface: control-ui
  category: control-ui.browser-access-and-trust
  coverage:
    primary:
      - control-ui.token-password-auth
  objective: >-
    Prove the Control UI submits one operator-entered Gateway secret for
    token and password authentication in browser connect requests and renders
    deterministic accepted, rejected, and recovered outcomes.
  successCriteria:
    - Real Chromium renders the login gate after the mocked Gateway requests credentials.
    - Submitting a token through Gateway secret populates both connect auth fields and visibly reaches the connected shell.
    - Submitting a password through Gateway secret populates both connect auth fields.
    - A rejected password renders visible recovery guidance and the mismatch reason without mounting the shell.
    - A replacement password visibly reconnects, with screenshots, video, and a credential-free behavior summary retained as artifacts.
  docsRefs:
    - docs/web/control-ui.md
  codeRefs:
    - ui/src/e2e/control-ui-credentials.e2e.test.ts
    - ui/src/components/login-gate.ts
    - ui/src/api/gateway.ts
  execution:
    kind: playwright
    path: ui/src/e2e/control-ui-credentials.e2e.test.ts
    testNamePattern: submits one secret for both authentication modes with visible acceptance and rejection recovery
    summary: >-
      Real Chromium coverage for single-field Gateway secret entry, connect-frame
      consumption, and visible authentication recovery at the browser boundary.
