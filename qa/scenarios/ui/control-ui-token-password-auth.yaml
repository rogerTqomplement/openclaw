title: Control UI Gateway secret submission

scenario:
  id: control-ui-token-password-auth
  surface: control-ui
  category: control-ui.browser-access-and-trust
  coverage:
    primary:
      - control-ui.token-password-auth
  objective: >-
    Prove the Control UI submits one operator-entered Gateway secret for both
    authentication modes in browser connect requests and renders deterministic accepted,
    rejected, and recovered outcomes.
  successCriteria:
    - Real Chromium renders the login gate after the mocked Gateway requests credentials.
    - The Gateway secret is submitted in both connect token and password fields and visibly reaches the connected shell when accepted in token mode.
    - Password mode uses the same Gateway secret field and submits its value in both connect authentication fields.
    - A rejected password renders visible recovery guidance and the mismatch reason without mounting the shell.
    - A replacement Gateway secret visibly reconnects in password mode, with screenshots, video, and a credential-free behavior summary retained as artifacts.
  docsRefs:
    - docs/web/control-ui.md
  codeRefs:
    - ui/src/e2e/control-ui-credentials.e2e.test.ts
    - ui/src/components/login-gate.ts
    - ui/src/api/gateway.ts
  execution:
    kind: playwright
    path: ui/src/e2e/control-ui-credentials.e2e.test.ts
    testNamePattern: submits one secret for both authentication modes with visible acceptance and rejection recovery
    summary: >-
      Real Chromium coverage for the shared Gateway secret field, connect-frame
      consumption, and visible authentication recovery at the browser boundary.
